name: ha_smart_display
description: "HA Smart Display — Home Assistant kiosk app for Echo Show 8"
publish_to: none
version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # WebSocket server
  shelf: ^1.4.1
  shelf_web_socket: ^2.0.0

  # Secure storage for device ID + pairing state
  flutter_secure_storage: ^9.0.0

  # Keep screen on
  wakelock_plus: ^1.1.4

  # Audio playback for timer/alarm chime
  just_audio: ^0.9.36


  # Cached images for weather icons, album art, photos
  cached_network_image: ^3.3.1

  # Disk-cache manager used directly by photo slideshow (explicit dep — also a
  # transitive dep of cached_network_image, but we call its API directly)
  flutter_cache_manager: ^3.3.1

  # UUID — generate permanent device ID on first boot
  uuid: ^4.3.3

  # Date/time formatting for clock
  intl: ^0.19.0

  # Logging
  logger: ^2.0.2+1

  # Runtime permission requests
  permission_handler: ^11.3.1

  # OTA update support
  package_info_plus: ^8.1.1
  http: ^1.2.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/fonts/
    - assets/audio/
